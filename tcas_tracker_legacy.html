<title>TCAS Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f4f7f6;
    --surface-3:#eaeeec;
    --border:#e3e8e6;
    --text:#1a2420;
    --text-muted:#68766e;
    --text-faint:#9aa8a0;
    --accent:#1f4b4a;
    --accent-strong:#0f3231;
    --accent-soft:#e8f3f1;
    --on-accent:#f6fbfa;
    --warn:#a5760a;
    --warn-soft:#fbf1dc;
    --danger:#b6382f;
    --danger-soft:#fdeae7;
    --success:#2f6f4e;
    --success-soft:#e6f4ec;
    --neutral:#6b7a71;
    --neutral-soft:#f1f4f2;
    --shadow: 0 1px 2px rgba(15,35,32,0.04), 0 6px 20px -14px rgba(15,35,32,0.12);
    --shadow-lg: 0 14px 34px -12px rgba(15,35,32,0.22);
    --radius-s: 8px;
    --radius-m: 14px;
    --radius-l: 20px;
    color-scheme: light;
  }
  /* This tracker commits to a single clean white look and no longer follows
     the system/browser dark-mode preference. The block below only applies
     if data-theme="dark" is set explicitly (currently unused, kept for a
     possible future manual toggle). */
  :root[data-theme="dark"]{
    --bg:#101615;
    --surface:#171f1d;
    --surface-2:#1e2926;
    --surface-3:#25322e;
    --border:#2c3a36;
    --text:#e9efec;
    --text-muted:#9db0a7;
    --text-faint:#6f8179;
    --accent:#6fc6bd;
    --accent-strong:#93dcd3;
    --accent-soft:rgba(111,198,189,0.14);
    --on-accent:#062220;
    --warn:#e0b350;
    --warn-soft:rgba(224,179,80,0.14);
    --danger:#e2766c;
    --danger-soft:rgba(226,118,108,0.14);
    --success:#7fd0a6;
    --success-soft:rgba(127,208,166,0.14);
    --neutral:#93a49b;
    --neutral-soft:rgba(147,164,155,0.12);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-lg: 0 16px 40px -8px rgba(0,0,0,0.55);
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--accent-soft); color:var(--accent-strong); }
  a{ color:var(--accent); }
  .num{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .display{ font-family:'Fraunces',Georgia,serif; }

  button{ font-family:inherit; }
  input,textarea,select{ font-family:inherit; font-size:inherit; color:inherit; }

  .skip-link{ position:absolute; left:-999px; top:0; background:var(--accent); color:var(--on-accent); padding:8px 14px; border-radius:0 0 8px 0; z-index:200; }
  .skip-link:focus{ left:0; }

  /* ---------- Layout shell ---------- */
  .app{ max-width:1040px; margin:0 auto; padding:0 20px 96px; }

  header.topbar{
    position:sticky; top:0; z-index:40;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar-inner{
    max-width:1040px; margin:0 auto; padding:16px 20px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; flex:1; min-width:200px; }
  .brand-mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:10px;
    background:var(--accent); color:var(--on-accent);
    font-family:'Fraunces',serif; font-weight:700; font-size:16px;
    flex-shrink:0;
  }
  .brand h1{ font-size:19px; margin:0; font-weight:700; letter-spacing:-0.01em; }
  .brand .tagline{ font-size:12.5px; color:var(--text-muted); }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }

  .save-indicator{
    font-size:12px; color:var(--text-faint); display:flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:999px; transition:background .2s, color .2s;
  }
  .save-indicator .dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); transition:background .2s; }
  .save-indicator[data-state="saving"] .dot{ background:var(--warn); animation:pulse 1s ease-in-out infinite; }
  .save-indicator[data-state="saved"]{ color:var(--success); }
  .save-indicator[data-state="saved"] .dot{ background:var(--success); }
  .save-indicator[data-state="error"]{ color:var(--danger); }
  .save-indicator[data-state="error"] .dot{ background:var(--danger); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:9px 15px; border-radius:999px; font-size:13.5px; font-weight:600;
    cursor:pointer; transition:transform .12s ease, background .15s, border-color .15s, box-shadow .15s;
    white-space:nowrap;
  }
  .btn:hover{ border-color:var(--accent); }
  .btn:active{ transform:scale(0.97); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); box-shadow:var(--shadow); }
  .btn-primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn-ghost{ background:transparent; border-color:transparent; }
  .btn-ghost:hover{ background:var(--surface-2); border-color:transparent; }
  .btn-danger-ghost{ background:transparent; border-color:transparent; color:var(--danger); }
  .btn-danger-ghost:hover{ background:var(--danger-soft); }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }
  .btn-icon{ padding:8px; border-radius:999px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  .banner{
    max-width:1040px; margin:14px auto 0; padding:10px 16px; border-radius:var(--radius-s);
    font-size:13px; display:flex; gap:8px; align-items:center;
    background:var(--warn-soft); color:var(--warn); border:1px solid transparent;
  }
  .banner[hidden]{ display:none; }

  /* ---------- Stats ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px;
    margin:22px 0 20px;
  }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .stat-tile .stat-num{ font-family:'Fraunces',serif; font-weight:600; font-size:30px; line-height:1; font-variant-numeric:tabular-nums; }
  .stat-tile .stat-label{ font-size:12.5px; color:var(--text-muted); margin-top:6px; }
  .stat-tile[data-tone="danger"] .stat-num{ color:var(--danger); }
  .stat-tile[data-tone="warn"] .stat-num{ color:var(--warn); }
  .stat-tile[data-tone="accent"] .stat-num{ color:var(--accent); }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom:16px;
  }
  .search-wrap{ position:relative; flex:1; min-width:220px; }
  .search-wrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none; }
  .search-input{
    width:100%; padding:9px 12px 9px 34px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text);
  }
  .search-input:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .sort-select{
    padding:9px 12px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); color:var(--text); cursor:pointer;
  }
  .filter-chips{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px; }
  .chip{
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    padding:6px 13px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer;
    transition:all .15s;
  }
  .chip:hover{ border-color:var(--accent); color:var(--text); }
  .chip[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

  .result-count{ font-size:12.5px; color:var(--text-faint); margin:2px 2px 14px; }

  .banner[data-tone="danger"]{ background:var(--danger-soft); color:var(--danger); }
  .banner{ align-items:flex-start; }
  .banner .banner-body{ flex:1; }
  .banner .banner-title{ font-weight:700; margin-bottom:2px; }
  .banner .banner-list{ font-size:12.5px; opacity:.92; }

  .view-tabs{ display:flex; gap:4px; margin:18px 0 16px; border-bottom:1px solid var(--border); }
  .view-tab{
    border:none; background:transparent; color:var(--text-muted); cursor:pointer; font-family:inherit;
    font-size:13.5px; font-weight:600; padding:9px 4px; margin-right:18px; position:relative; top:1px;
    border-bottom:2px solid transparent;
  }
  .view-tab:hover{ color:var(--text); }
  .view-tab[aria-pressed="true"]{ color:var(--accent); border-bottom-color:var(--accent); }

  .cost-panel{
    display:flex; gap:22px; flex-wrap:wrap; align-items:center;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-m);
    padding:12px 18px; margin:0 0 18px; font-size:12.5px; color:var(--text-muted);
  }
  .cost-panel b{ font-family:'IBM Plex Mono',monospace; font-size:16px; color:var(--text); font-weight:600; }
  .cost-panel .cost-item{ display:flex; flex-direction:column; gap:2px; }

  .star-btn{
    background:transparent; border:none; cursor:pointer; padding:8px; border-radius:999px;
    display:inline-flex; align-items:center; justify-content:center; color:var(--text-faint);
    transition:background .15s, color .15s;
  }
  .star-btn:hover{ background:var(--surface-2); color:var(--warn); }
  .star-btn[data-active="true"]{ color:var(--warn); }
  .star-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }

  .compare-scroll{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-m); box-shadow:var(--shadow); }
  table.compare-table{ border-collapse:collapse; width:100%; min-width:820px; font-size:12.5px; }
  table.compare-table th, table.compare-table td{
    padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); vertical-align:top; white-space:nowrap;
  }
  table.compare-table th{
    background:var(--surface-2); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
    color:var(--text-faint); font-weight:700; position:sticky; top:0;
  }
  table.compare-table td.wrap{ white-space:normal; min-width:170px; }
  table.compare-table tbody tr:hover{ background:var(--surface-2); }
  table.compare-table td.num-cell{ font-family:'IBM Plex Mono',monospace; text-align:right; }
  table.compare-table .uni-cell{ font-weight:700; }
  table.compare-table .sub-cell{ color:var(--text-muted); font-size:11.5px; font-weight:400; }

  .timeline{ position:relative; padding-left:26px; }
  .timeline::before{ content:""; position:absolute; left:5px; top:6px; bottom:6px; width:2px; background:var(--border); }
  .timeline-month{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:26px 0 10px; color:var(--text); }
  .timeline-month:first-child{ margin-top:0; }
  .timeline-event{ position:relative; padding:0 0 16px 20px; }
  .timeline-event::before{
    content:""; position:absolute; left:-25px; top:4px; width:10px; height:10px; border-radius:50%;
    background:var(--surface); border:2px solid var(--neutral);
  }
  .timeline-event[data-tone="danger"]::before{ border-color:var(--danger); }
  .timeline-event[data-tone="warn"]::before{ border-color:var(--warn); }
  .timeline-event[data-tone="accent"]::before{ border-color:var(--accent); }
  .timeline-date{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--text-faint); }
  .timeline-title{ font-size:13.5px; font-weight:600; margin-top:1px; }
  .timeline-sub{ font-size:12px; color:var(--text-muted); }
  .timeline-clash{
    display:inline-flex; align-items:center; gap:4px; margin-top:5px; font-size:11px; font-weight:700;
    color:var(--danger); background:var(--danger-soft); padding:2px 8px; border-radius:999px;
  }

  /* ---------- Cards ---------- */
  .card-list{ display:flex; flex-direction:column; gap:12px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-m);
    box-shadow:var(--shadow); overflow:hidden;
    display:grid; grid-template-columns:96px 1fr;
  }
  .card-urgency{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    padding:14px 8px; text-align:center; background:var(--neutral-soft); color:var(--neutral);
    border-right:1px solid var(--border);
  }
  .card-urgency[data-tone="danger"]{ background:var(--danger-soft); color:var(--danger); }
  .card-urgency[data-tone="warn"]{ background:var(--warn-soft); color:var(--warn); }
  .card-urgency[data-tone="accent"]{ background:var(--accent-soft); color:var(--accent); }
  .card-urgency[data-tone="success"]{ background:var(--success-soft); color:var(--success); }
  .card-urgency .u-num{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; line-height:1; }
  .card-urgency .u-label{ font-size:10.5px; font-weight:600; line-height:1.25; max-width:78px; }

  .card-body{ padding:14px 18px 16px; min-width:0; }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-title-group{ min-width:0; }
  .card-uni{ font-size:16px; font-weight:700; letter-spacing:-0.01em; }
  .card-sub{ font-size:13px; color:var(--text-muted); margin-top:1px; }
  .card-actions{ display:flex; gap:2px; flex-shrink:0; }

  .badge-row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .badge{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:var(--surface-2); color:var(--text-muted); border:1px solid transparent;
  }
  .badge[data-tone="neutral"]{ background:var(--neutral-soft); color:var(--neutral); }
  .badge[data-tone="warn"]{ background:var(--warn-soft); color:var(--warn); }
  .badge[data-tone="danger"]{ background:var(--danger-soft); color:var(--danger); }
  .badge[data-tone="accent"]{ background:var(--accent-soft); color:var(--accent); }
  .badge[data-tone="success"]{ background:var(--success-soft); color:var(--success); }

  .status-quick-btn{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:600; padding:3px 9px 3px 8px; border-radius:999px;
    background:transparent; cursor:pointer; font-family:inherit;
    border:1px dashed var(--border); color:var(--text-muted);
    transition:background .15s, border-color .15s, color .15s;
  }
  .status-quick-btn:hover{ background:var(--surface-2); }
  .status-quick-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .status-quick-btn[data-tone="neutral"]{ border-color:var(--neutral); color:var(--neutral); }
  .status-quick-btn[data-tone="warn"]{ border-color:var(--warn); color:var(--warn); }
  .status-quick-btn[data-tone="danger"]{ border-color:var(--danger); color:var(--danger); }
  .status-quick-btn[data-tone="accent"]{ border-color:var(--accent); color:var(--accent); }
  .status-quick-btn[data-tone="success"]{ border-color:var(--success); color:var(--success); }
  .status-quick-btn[data-tone="neutral"]:hover{ background:var(--neutral-soft); }
  .status-quick-btn[data-tone="warn"]:hover{ background:var(--warn-soft); }
  .status-quick-btn[data-tone="danger"]:hover{ background:var(--danger-soft); }
  .status-quick-btn[data-tone="accent"]:hover{ background:var(--accent-soft); }
  .status-quick-btn[data-tone="success"]:hover{ background:var(--success-soft); }

  .date-row{
    display:flex; gap:16px; flex-wrap:wrap; margin-top:11px; font-size:12.5px; color:var(--text-muted);
  }
  .date-row .date-item b{ display:block; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); margin-bottom:2px; }
  .date-row .date-item span{ font-family:'IBM Plex Mono',monospace; color:var(--text); font-size:12.5px; }

  details.more{ margin-top:11px; }
  details.more > summary{
    list-style:none; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--accent);
    display:inline-flex; align-items:center; gap:4px; user-select:none;
  }
  details.more > summary::-webkit-details-marker{ display:none; }
  details.more > summary .chev{ transition:transform .15s; }
  details.more[open] > summary .chev{ transform:rotate(90deg); }
  .more-content{ padding-top:12px; display:flex; flex-direction:column; gap:12px; }

  .field-block b{ display:block; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin-bottom:5px; }
  .criteria-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .criteria-chip{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:var(--surface-2); padding:3px 9px; border-radius:6px; color:var(--text); }
  .note-box{ background:var(--accent-soft); color:var(--accent-strong); padding:9px 12px; border-radius:var(--radius-s); font-size:12.5px; }
  .link-line a{ font-size:12.5px; word-break:break-all; }
  .link-line .file-label{ font-size:12.5px; color:var(--text-muted); }

  .doc-list{ display:flex; flex-direction:column; gap:5px; }
  .doc-item{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .doc-item input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--accent); flex-shrink:0; cursor:pointer; }
  .doc-item label{ cursor:pointer; }
  .doc-item[data-done="true"] label{ color:var(--text-faint); text-decoration:line-through; }
  .doc-progress{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .doc-empty{ font-size:12.5px; color:var(--text-faint); font-style:italic; }

  .confirm-bar{
    display:flex; align-items:center; gap:8px; background:var(--danger-soft); color:var(--danger);
    padding:7px 10px; border-radius:var(--radius-s); font-size:12.5px; font-weight:600;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-muted);
  }
  .empty-state .display{ font-size:22px; color:var(--text); margin-bottom:6px; }

  /* ---------- Dialog / form ---------- */
  dialog.modal{
    border:none; border-radius:var(--radius-l); padding:0; max-width:640px; width:calc(100vw - 32px);
    max-height:calc(100vh - 48px); background:var(--surface); color:var(--text);
    box-shadow:var(--shadow-lg);
  }
  dialog.modal::backdrop{ background:rgba(10,18,16,0.55); backdrop-filter:blur(2px); }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:18px 22px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2;
  }
  .modal-head h2{ font-size:17px; margin:0; font-family:'Fraunces',serif; font-weight:600; }
  .modal-body{ padding:20px 22px; overflow-y:auto; max-height:calc(100vh - 180px); }
  .modal-foot{
    padding:16px 22px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px;
    position:sticky; bottom:0; background:var(--surface);
  }
  .form-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-grid .full{ grid-column:1/-1; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:12px; font-weight:600; color:var(--text-muted); }
  .field .hint{ font-size:11px; color:var(--text-faint); font-weight:400; }
  .field input[type="text"], .field input[type="url"], .field input[type="date"], .field textarea, .field select{
    padding:9px 11px; border-radius:var(--radius-s); border:1px solid var(--border);
    background:var(--bg); color:var(--text); width:100%;
  }
  .field input:focus-visible, .field textarea:focus-visible, .field select:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .field textarea{ resize:vertical; min-height:56px; font-family:inherit; }
  .checkbox-field{ display:flex; align-items:center; gap:8px; flex-direction:row; }
  .checkbox-field input{ width:16px; height:16px; accent-color:var(--accent); }
  .checkbox-field label{ font-size:13px; font-weight:500; color:var(--text); }

  .doc-editor{ display:flex; flex-direction:column; gap:8px; }
  .doc-editor-row{ display:flex; gap:8px; align-items:center; }
  .doc-editor-row input{ flex:1; padding:8px 10px; border-radius:var(--radius-s); border:1px solid var(--border); background:var(--bg); color:var(--text); }
  .doc-editor-row button{ flex-shrink:0; }

  fieldset{ border:none; padding:0; margin:0; }
  legend{ font-size:13px; font-weight:700; margin-bottom:10px; padding:0; }

  .toast-stack{

  function todayISO(){
    var d = new Date();
    var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,"0"), day = String(d.getDate()).padStart(2,"0");
    return y+"-"+m+"-"+day;
  }
  function beYear(iso){
    var y = parseInt(iso.slice(0,4),10);
    return y + 543;
  }
  function isFullDate(s){ return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function isMonthYear(s){ return typeof s === "string" && /^\d{4}-\d{2}$/.test(s); }

  function formatDate(iso, opts){
    opts = opts || {};
    if(!iso) return "—";
    if(isFullDate(iso)){
      var parts = iso.split("-");
      var y = parseInt(parts[0],10), m = parseInt(parts[1],10), d = parseInt(parts[2],10);
      return d + " " + THAI_MONTHS[m-1] + " " + (y+543);
    }
    if(isMonthYear(iso)){
      var p2 = iso.split("-");
      return THAI_MONTHS[parseInt(p2[1],10)-1] + " " + (parseInt(p2[0],10)+543);
    }
    return iso;
  }

  function daysUntil(iso){
    var today = new Date(todayISO()+"T00:00:00");
    var target = new Date(iso+"T00:00:00");
    return Math.round((target-today)/86400000);
  }

  function countdownChip(diffDays, pastLabel, dueTodayLabel){
    if(diffDays < 0) return { tone:"neutral", label: pastLabel, sortRank: 3.5, diffDays: diffDays };
    if(diffDays === 0) return { tone:"danger", label: dueTodayLabel, sortRank: 0, sortKey: 0, diffDays: 0 };
    if(diffDays <= 7) return { tone:"danger", label:"เหลือ "+diffDays+" วัน", sortRank: 0, sortKey: diffDays, diffDays: diffDays };
    if(diffDays <= 21) return { tone:"warn", label:"เหลือ "+diffDays+" วัน", sortRank: 1, sortKey: diffDays, diffDays: diffDays };
    return { tone:"accent", label:"เหลือ "+diffDays+" วัน", sortRank: 2, sortKey: diffDays, diffDays: diffDays };
  }

  function computeUrgency(p){
    var meta = STATUS_META[p.status] || STATUS_META["รอประกาศเกณฑ์"];

    // Called for interview: track the countdown to the interview date itself.
    if(p.status === "ติดสัมภาษณ์" && isFullDate(p.interviewDate)){
      var diffI = daysUntil(p.interviewDate);
      if(diffI < 0){
        return { mode:"interview", tone:"neutral", label:"ผ่านวันสัมภาษณ์แล้ว", sortRank: 3.5, diffDays: diffI };
      }
      var c = countdownChip(diffI, "", "สัมภาษณ์วันนี้");
      c.mode = "interview";
      c.dateLabel = "วันสัมภาษณ์";
      return c;
    }

    // Submitted: track the countdown to the result announcement, if known.
    if(p.status === "ยื่นสมัครแล้ว" && isFullDate(p.resultDate)){
      var diffR = daysUntil(p.resultDate);
      if(diffR < 0){
        return { mode:"result", tone:"neutral", label:"ถึงกำหนดประกาศผลแล้ว", sortRank: 3.5, diffDays: diffR };
      }
      var cr = countdownChip(diffR, "", "ประกาศผลวันนี้");
      cr.mode = "result";
      cr.dateLabel = "รอประกาศผล";
      return cr;
    }

    // Waiting to confirm a secured seat: always a live action item.
    if(p.status === "รอยืนยันสิทธิ์"){
      return { mode:"actionNeeded", tone:"warn", label:"รอยืนยันสิทธิ์", sortRank: 0.5 };
    }

    if(meta.category === "terminal"){
      return { mode:"terminal", tone: meta.color, label: p.status, sortRank: 5 };
    }
    if(!isFullDate(p.closeDate)){
      return { mode:"unknown", tone:"neutral", label:"รอประกาศกำหนดการ", sortRank: 4 };
    }
    var diffDays = daysUntil(p.closeDate);

    var notYetOpen = false;
    if(isFullDate(p.openDate)){
      var open = new Date(p.openDate+"T00:00:00");
      var today = new Date(todayISO()+"T00:00:00");
      if(today < open) notYetOpen = true;
    }

    if(diffDays < 0){
      return { mode:"closed", tone:"neutral", label:"ปิดรับสมัครแล้ว", diffDays: diffDays, sortRank: 3.5 };
    }
    if(notYetOpen){
      return { mode:"notOpen", tone:"neutral", label:"ยังไม่เปิดรับ", diffDays: diffDays, sortRank: 3 };
    }
    var chip = countdownChip(diffDays, "", "ปิดวันนี้");
    chip.mode = diffDays <= 7 ? "urgent" : (diffDays <= 21 ? "soon" : "plenty");
    return chip;
  }

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function renderStats(){
    var total = state.programs.length;
    var urgent = state.programs.filter(function(p){ return computeUrgency(p).mode === "urgent"; }).length;
    var awaiting = state.programs.filter(function(p){ return p.status === "รอประกาศเกณฑ์"; }).length;
    var docsIncomplete = state.programs.filter(function(p){
      return p.documents && p.documents.length > 0 && p.documents.some(function(d){ return !d.done; });
    }).length;

    var tiles = [
      { num: total, label: "รายการที่ติดตาม", tone: "" },
      { num: urgent, label: "ใกล้ปิดรับ (≤7 วัน)", tone: "danger" },
      { num: awaiting, label: "รอประกาศเกณฑ์", tone: "warn" },
      { num: docsIncomplete, label: "เอกสารยังไม่ครบ", tone: "accent" }
    ];
    statsRow.innerHTML = tiles.map(function(t){
      return '<div class="stat-tile"'+(t.tone?' data-tone="'+t.tone+'"':'')+'>'+
        '<div class="stat-num num">'+t.num+'</div>'+
        '<div class="stat-label">'+t.label+'</div></div>';
    }).join("");
  }

  function renderFilterChips(){
    var chips = ['<button type="button" class="chip" data-status="__all__" aria-pressed="'+(state.filterStatuses.size===0)+'">ทั้งหมด</button>'];
    STATUS_ORDER.forEach(function(status){
      var pressed = state.filterStatuses.has(status);
      chips.push('<button type="button" class="chip" data-status="'+escapeHtml(status)+'" aria-pressed="'+pressed+'">'+escapeHtml(status)+'</button>');
    });
    filterChipsEl.innerHTML = chips.join("");
  }

  function renderExtraFilterChips(){
    var defs = [
      { key:"tcasFolio", label:"ต้องใช้ TCASFolio" },
      { key:"hasInterview", label:"มีนัดสัมภาษณ์แล้ว" },
      { key:"starred", label:"★ ปักดาวไว้" }
    ];
    extraFilterChipsEl.innerHTML = defs.map(function(d){
      return '<button type="button" class="chip" data-extra-filter="'+d.key+'" aria-pressed="'+(!!state.extraFilters[d.key])+'">'+d.label+'</button>';
    }).join("");
  }

  function renderCostPanel(){
    var withFee = state.programs.filter(function(p){ return p.applicationFee != null; });
    if(withFee.length === 0){ costPanel.hidden = true; costPanel.innerHTML = ""; return; }
    var total = withFee.reduce(function(s,p){ return s + p.applicationFee; }, 0);
    var paid = withFee.filter(function(p){ return p.feePaid; }).reduce(function(s,p){ return s + p.applicationFee; }, 0);
    var unpaid = total - paid;
    function money(n){ return n.toLocaleString("th-TH"); }
    costPanel.hidden = false;
    costPanel.innerHTML =
      '<div class="cost-item"><span>ค่าสมัครรวมทั้งหมด</span><b>'+money(total)+' บาท</b></div>'+
      '<div class="cost-item"><span>จ่ายแล้ว</span><b style="color:var(--success);">'+money(paid)+' บาท</b></div>'+
      '<div class="cost-item"><span>ค้างจ่าย</span><b style="color:'+(unpaid>0?'var(--danger)':'var(--text)')+';">'+money(unpaid)+' บาท</b></div>'+
      '<div class="cost-item"><span>จำนวนรายการที่ระบุค่าสมัคร</span><b>'+withFee.length+' / '+state.programs.length+'</b></div>';
  }

  function renderUrgentBanner(){
    var items = [];
    state.programs.forEach(function(p){
      var u = computeUrgency(p);
      if(u.mode === "actionNeeded"){
        items.push({ p:p, text: p.university+" — รอยืนยันสิทธิ์" });
      } else if(u.diffDays != null && u.diffDays >= 0 && u.diffDays <= 2 && u.sortKey != null){
        if(u.mode === "urgent"){
          items.push({ p:p, text: p.university+" — ปิดรับสมัคร"+(u.diffDays===0?"วันนี้":"ในอีก "+u.diffDays+" วัน") });
        } else if(u.mode === "interview"){
          items.push({ p:p, text: p.university+" — สัมภาษณ์"+(u.diffDays===0?"วันนี้":"ในอีก "+u.diffDays+" วัน") });
        } else if(u.mode === "result"){
          items.push({ p:p, text: p.university+" — ประกาศผล"+(u.diffDays===0?"วันนี้":"ในอีก "+u.diffDays+" วัน") });
        }
      }
    });
    if(items.length === 0){ urgentBanner.hidden = true; urgentBanner.innerHTML = ""; return; }
    urgentBanner.hidden = false;
    urgentBanner.setAttribute("data-tone","danger");
    var shown = items.slice(0,6);
    var extra = items.length - shown.length;
    urgentBanner.innerHTML =
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" style="flex-shrink:0;margin-top:2px;"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>'+
      '<div class="banner-body"><div class="banner-title">มีรายการที่ต้องรีบดำเนินการ ('+items.length+')</div>'+
      '<div class="banner-list">'+shown.map(function(it){ return escapeHtml(it.text); }).join(" · ")+(extra>0?' · และอีก '+extra+' รายการ':'')+'</div></div>';
  }

  function urgencySort(a,b){
    var ua = computeUrgency(a), ub = computeUrgency(b);
    if(ua.sortRank !== ub.sortRank) return ua.sortRank - ub.sortRank;
    var ka = ua.sortKey != null ? ua.sortKey : (ua.diffDays != null ? ua.diffDays : 9999);
    var kb = ub.sortKey != null ? ub.sortKey : (ub.diffDays != null ? ub.diffDays : 9999);
    return ka - kb;
  }

  function getFiltered(){
    var q = state.search.trim().toLowerCase();
    var list = state.programs.filter(function(p){
      if(state.filterStatuses.size > 0 && !state.filterStatuses.has(p.status)) return false;
      if(state.extraFilters.tcasFolio && !p.tcasFolio) return false;
      if(state.extraFilters.hasInterview && !isFullDate(p.interviewDate)) return false;
      if(state.extraFilters.starred && !(p.priority > 0)) return false;
      if(!q) return true;
      var hay = [p.university,p.faculty,p.major,p.curriculum,p.round,p.criteria,p.note].join(" ").toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    if(state.sort === "name"){
      list.sort(function(a,b){ return a.university.localeCompare(b.university,"th"); });
    } else if(state.sort === "status"){
      list.sort(function(a,b){
        return STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status);
      });
    } else if(state.sort === "priority"){
      list.sort(function(a,b){
        var ra = (a.priority && a.priority > 0) ? a.priority : 99;
        var rb = (b.priority && b.priority > 0) ? b.priority : 99;
        if(ra !== rb) return ra - rb;
        return urgencySort(a,b);
      });
    } else {
      list.sort(urgencySort);
    }
    return list;
  }

  function docProgress(p){
    if(!p.documents || p.documents.length === 0) return null;
    var done = p.documents.filter(function(d){ return d.done; }).length;
    return { done: done, total: p.documents.length };
  }

  function cardHtml(p){
    var u = computeUrgency(p);
    var progress = docProgress(p);
    var criteriaChips = "";
    if(p.criteria){
      criteriaChips = p.criteria.split(",").map(function(c){
        return c.trim();
      }).filter(Boolean).map(function(c){
        return '<span class="criteria-chip">'+escapeHtml(c)+'</span>';
      }).join("");
    }
    var linkLine = "";
    if(p.link){
      if(/^https?:\/\//i.test(p.link)){
        linkLine = '<div class="field-block link-line"><b>ลิงก์ประกาศ</b><a href="'+escapeHtml(p.link)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(p.link)+'</a></div>';
      } else {
        linkLine = '<div class="field-block link-line"><b>เอกสารอ้างอิง</b><span class="file-label">'+escapeHtml(p.link)+'</span></div>';
      }
    }
    var docsHtml = "";
    if(p.documents && p.documents.length){
      docsHtml = '<div class="field-block"><b>เอกสารที่ต้องเตรียม'+(progress?' ('+progress.done+'/'+progress.total+')':'')+'</b><div class="doc-list">'+
        p.documents.map(function(d,i){
          var did = "doc-"+p.id+"-"+i;
          return '<div class="doc-item" data-done="'+!!d.done+'">'+
            '<input type="checkbox" id="'+did+'" data-doc-index="'+i+'" data-pid="'+p.id+'" '+(d.done?'checked':'')+(isWriter?'':' disabled')+'>'+
            '<label for="'+did+'">'+escapeHtml(d.text)+'</label></div>';
        }).join("")+
      '</div></div>';
    } else {
      docsHtml = '<div class="field-block"><b>เอกสารที่ต้องเตรียม</b><div class="doc-empty">ยังไม่ได้ระบุเอกสาร</div></div>';
    }

    var interviewBlock = "";
    if(isFullDate(p.interviewDate) || p.interviewPlace){
      var fmtLabel = p.interviewFormat ? (INTERVIEW_FORMAT_LABEL[p.interviewFormat]||p.interviewFormat) : "";
      interviewBlock = '<div class="field-block"><b>นัดสัมภาษณ์</b><div>'+
        (isFullDate(p.interviewDate) ? escapeHtml(formatDate(p.interviewDate)) : "ยังไม่ระบุวัน") +
        (fmtLabel ? ' · '+escapeHtml(fmtLabel) : '') +
        (p.interviewPlace ? '<br><span style="color:var(--text-muted);font-size:12.5px;">'+escapeHtml(p.interviewPlace)+'</span>' : '') +
      '</div></div>';
    }

    var feeBlock = "";
    if(p.applicationFee != null){
      var feeId = "fee-"+p.id;
      feeBlock = '<div class="field-block"><b>ค่าสมัคร</b><div class="doc-item" data-done="'+!!p.feePaid+'">'+
        '<input type="checkbox" id="'+feeId+'" data-fee-paid="'+p.id+'" '+(p.feePaid?'checked':'')+(isWriter?'':' disabled')+'>'+
        '<label for="'+feeId+'">'+p.applicationFee.toLocaleString('th-TH')+' บาท'+(p.feePaid?' (จ่ายแล้ว)':' (ยังไม่จ่าย)')+'</label>'+
      '</div></div>';
    }

    var moreContent = '<div class="more-content">'+
        (p.curriculum ? '<div class="field-block"><b>ชื่อหลักสูตรเต็ม</b><div>'+escapeHtml(p.curriculum)+'</div></div>' : '') +
        (criteriaChips ? '<div class="field-block"><b>เกณฑ์การพิจารณา</b><div class="criteria-chips">'+criteriaChips+'</div></div>' : '') +
        docsHtml +
        interviewBlock +
        feeBlock +
        linkLine +
        (p.note ? '<div class="note-box">'+escapeHtml(p.note)+'</div>' : '') +
      '</div>';

    var subParts = [p.faculty, p.major].filter(Boolean).join(" · ");

    return '<article class="card" data-id="'+p.id+'">'+
      '<div class="card-urgency" data-tone="'+u.tone+'">'+
        (u.sortKey != null ?
          '<div class="u-num num">'+u.diffDays+'</div><div class="u-label">'+escapeHtml(u.dateLabel || "วันที่เหลือ")+'</div>' :
          '<div class="u-label" style="font-size:12.5px;">'+escapeHtml(u.label)+'</div>')+
      '</div>'+
      '<div class="card-body">'+
        '<div class="card-head">'+
          '<div class="card-title-group">'+
            '<div class="card-uni">'+escapeHtml(p.university)+'</div>'+
            (subParts ? '<div class="card-sub">'+escapeHtml(subParts)+'</div>' : '')+
          '</div>'+
          '<div class="card-actions" data-actions>'+
            (isWriter ? (
              '<button type="button" class="star-btn" data-star="'+p.id+'" data-active="'+(p.priority>0)+'" aria-label="ปักดาวเป็นอันดับที่ชอบ" title="ปักดาวเป็นอันดับที่ชอบ">'+
                (p.priority>0 ?
                  '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.2"><path d="m12 2.5 2.9 6.4 6.9.7-5.2 4.8 1.5 6.9-6.1-3.6-6.1 3.6 1.5-6.9-5.2-4.8 6.9-.7Z"/></svg>' :
                  '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 2.5 2.9 6.4 6.9.7-5.2 4.8 1.5 6.9-6.1-3.6-6.1 3.6 1.5-6.9-5.2-4.8 6.9-.7Z"/></svg>')+
              '</button>'+
              '<button type="button" class="btn btn-ghost btn-icon" data-duplicate="'+p.id+'" aria-label="คัดลอกรายการ" title="คัดลอกรายการ">'+
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'+
              '</button>'+
              '<button type="button" class="btn btn-ghost btn-icon" data-edit="'+p.id+'" aria-label="แก้ไข">'+
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'+
              '</button>'+
              '<button type="button" class="btn btn-danger-ghost btn-icon" data-delete="'+p.id+'" aria-label="ลบ">'+
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0-1 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 6"/></svg>'+
              '</button>'
            ) : "")+
          '</div>'+
        '</div>'+
        '<div class="badge-row">'+
          (p.priority > 0 ? '<span class="badge" data-tone="warn">★ อันดับที่ชอบ '+p.priority+'</span>' : '')+
          (p.round ? '<span class="badge">'+escapeHtml(p.round)+'</span>' : '')+
          '<span class="badge" data-tone="'+(STATUS_META[p.status]?STATUS_META[p.status].color:"neutral")+'">'+escapeHtml(p.status)+'</span>'+
          (p.tcasFolio ? '<span class="badge" data-tone="accent">ใช้ TCASFolio</span>' : '')+
          (isFullDate(p.interviewDate) ? '<span class="badge" data-tone="accent">สัมภาษณ์ '+formatDate(p.interviewDate)+(p.interviewFormat?' · '+escapeHtml(INTERVIEW_FORMAT_LABEL[p.interviewFormat]||p.interviewFormat):'')+'</span>' : '')+
          (isWriter ? (NEXT_STATUS[p.status]||[]).map(function(ns){
            return '<button type="button" class="status-quick-btn" data-tone="'+(STATUS_META[ns]?STATUS_META[ns].color:"neutral")+'" data-quick-status="'+p.id+'" data-next-status="'+escapeHtml(ns)+'">'+
              '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L19 7"/></svg> '+
              escapeHtml(ns)+
            '</button>';
          }).join('') : '')+
        '</div>'+
        '<div class="date-row">'+
          '<div class="date-item"><b>เปิดรับ</b><span>'+formatDate(p.openDate)+'</span></div>'+
          '<div class="date-item"><b>ปิดรับ</b><span>'+formatDate(p.closeDate)+'</span></div>'+
          '<div class="date-item"><b>ประกาศผล</b><span>'+formatDate(p.resultDate)+'</span></div>'+
        '</div>'+
        '<details class="more">'+
          '<summary><svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m9 6 6 6-6 6"/></svg> รายละเอียดเพิ่มเติม</summary>'+
          moreContent+
        '</details>'+
      '</div>'+
    '</article>';
  }

  /* ---- Compare view ---- */
  function parseCriteriaKV(text){
    var result = {};
    if(!text) return result;
    var re = /([A-Za-zก-๙0-9.() /]+?)\s*(\d{1,3}(?:\.\d+)?)\s*%/g;
    var m;
    while((m = re.exec(text))){
      var key = m[1].replace(/^[,;]+|[,;]+$/g," ").trim().replace(/\s+/g," ");
      if(!key) continue;
      result[key] = m[2];
    }
    return result;
  }

  function renderCompareView(list){
    if(list.length === 0){
      compareViewWrap.innerHTML = '<div class="empty-state"><div class="display">ไม่มีรายการให้เปรียบเทียบ</div></div>';
      return;
    }
    var parsedList = list.map(function(p){ return { p:p, kv: parseCriteriaKV(p.criteria) }; });
    var freq = {};
    parsedList.forEach(function(item){
      Object.keys(item.kv).forEach(function(k){ freq[k] = (freq[k]||0) + 1; });
    });
    var columns = Object.keys(freq).sort(function(a,b){
      var fa = freq[a], fb = freq[b];
      if(fb !== fa) return fb - fa;
      return a.localeCompare(b);
    }).slice(0,6);

    var head = '<tr><th>มหาวิทยาลัย / สาขา</th><th>รอบ</th><th>สถานะ</th><th>ปิดรับ</th><th>สัมภาษณ์</th>'+
      columns.map(function(c){ return '<th class="num-cell">'+escapeHtml(c)+'</th>'; }).join("")+
      '<th class="wrap">เกณฑ์ทั้งหมด</th></tr>';

    var rows = parsedList.map(function(item){
      var p = item.p, kv = item.kv;
      var sub = [p.faculty, p.major].filter(Boolean).join(" · ");
      return '<tr>'+
        '<td><div class="uni-cell">'+escapeHtml(p.university)+(p.priority>0?' ★':'')+'</div>'+(sub?'<div class="sub-cell">'+escapeHtml(sub)+'</div>':'')+'</td>'+
        '<td>'+escapeHtml(p.round||"—")+'</td>'+
        '<td><span class="badge" data-tone="'+(STATUS_META[p.status]?STATUS_META[p.status].color:"neutral")+'">'+escapeHtml(p.status)+'</span></td>'+
        '<td>'+formatDate(p.closeDate)+'</td>'+
        '<td>'+(isFullDate(p.interviewDate)?formatDate(p.interviewDate):"—")+'</td>'+
        columns.map(function(c){ return '<td class="num-cell">'+(kv[c] != null ? kv[c]+"%" : "—")+'</td>'; }).join("")+
        '<td class="wrap">'+escapeHtml(p.criteria || "—")+'</td>'+
      '</tr>';
    }).join("");

    compareViewWrap.innerHTML = '<div class="compare-scroll"><table class="compare-table"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table></div>';
  }

  /* ---- Timeline view ---- */
  var EVENT_TYPE_LABEL = { open:"เปิดรับสมัคร", close:"ปิดรับสมัคร", interview:"สัมภาษณ์", result:"ประกาศผล" };
  var EVENT_TYPE_TONE = { open:"neutral", close:"danger", interview:"accent", result:"warn" };

  function renderTimelineView(list){
    var events = [];
    list.forEach(function(p){
      if(isFullDate(p.openDate)) events.push({ date:p.openDate, type:"open", p:p });
      if(isFullDate(p.closeDate)) events.push({ date:p.closeDate, type:"close", p:p });
      if(isFullDate(p.interviewDate)) events.push({ date:p.interviewDate, type:"interview", p:p });
      if(isFullDate(p.resultDate)) events.push({ date:p.resultDate, type:"result", p:p });
    });
    if(events.length === 0){
      timelineViewWrap.innerHTML = '<div class="empty-state"><div class="display">ยังไม่มีวันที่ให้แสดงในไทม์ไลน์</div><div>เพิ่มวันเปิด/ปิดรับสมัครในแต่ละรายการก่อน</div></div>';
      return;
    }
    events.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });

    var dateCounts = {};
    events.forEach(function(e){ dateCounts[e.date] = (dateCounts[e.date]||0) + 1; });

    var html = "";
    var currentMonthKey = null;
    events.forEach(function(e){
      var parts = e.date.split("-");
      var monthKey = parts[0]+"-"+parts[1];
      if(monthKey !== currentMonthKey){
        currentMonthKey = monthKey;
        html += '<div class="timeline-month">'+THAI_MONTHS[parseInt(parts[1],10)-1]+" "+(parseInt(parts[0],10)+543)+'</div>';
      }
      var clashCount = dateCounts[e.date];
      var sub = [e.p.faculty, e.p.major].filter(Boolean).join(" · ");
      html += '<div class="timeline-event" data-tone="'+EVENT_TYPE_TONE[e.type]+'">'+
        '<div class="timeline-date">'+formatDate(e.date)+' · '+EVENT_TYPE_LABEL[e.type]+'</div>'+
        '<div class="timeline-title">'+escapeHtml(e.p.university)+'</div>'+
        (sub ? '<div class="timeline-sub">'+escapeHtml(sub)+'</div>' : '')+
        (clashCount > 1 ? '<div class="timeline-clash">⚠ มี '+clashCount+' กำหนดการชนกันวันนี้</div>' : '')+
      '</div>';
    });
    timelineViewWrap.innerHTML = '<div class="timeline">'+html+'</div>';
  }

  function updateViewTabsUI(){
    viewTabs.querySelectorAll(".view-tab").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-view") === state.view ? "true" : "false");
    });
    var isList = state.view === "list";
    // Note: cardList has an author CSS rule setting display:flex, which beats
    // the native [hidden] UA rule by cascade origin — so hide it via inline
    // style, not the hidden attribute.
    cardList.style.display = isList ? "" : "none";
    sortSelect.style.display = isList ? "" : "none";
    compareViewWrap.hidden = state.view !== "compare";
    timelineViewWrap.hidden = state.view !== "timeline";
  }

  function render(){
    renderStats();
    renderCostPanel();
    renderUrgentBanner();
    renderFilterChips();
    renderExtraFilterChips();
    updateViewTabsUI();

    var list = getFiltered();
    resultCount.textContent = "แสดง "+list.length+" จาก "+state.programs.length+" รายการ";

    if(state.view === "compare"){
      emptyState.hidden = true;
      renderCompareView(list);
      return;
    }
    if(state.view === "timeline"){
      emptyState.hidden = true;
      renderTimelineView(list);
      return;
    }

    if(list.length === 0){
      cardList.innerHTML = "";
      emptyState.hidden = state.programs.length === 0 ? true : false;
      if(state.programs.length === 0){
        cardList.innerHTML = '<div class="empty-state"><div class="display">ยังไม่มีรายการติดตาม</div><div>กด "เพิ่มรายการ" เพื่อเริ่มบันทึกมหาวิทยาลัยที่สนใจ</div></div>';
      }
    } else {
      emptyState.hidden = true;
      cardList.innerHTML = list.map(cardHtml).join("");
    }
  }

  /* ================= Toast ================= */
  function toast(msg, tone){
    var el = document.createElement("div");
    el.className = "toast";
    if(tone) el.setAttribute("data-tone", tone);
    el.textContent = msg;
    toastStack.appendChild(el);
    setTimeout(function(){ el.remove(); }, 3200);
  }

  function showUndoToast(msg, undoFn){
    var el = document.createElement("div");
    el.className = "toast";
    el.style.display = "inline-flex";
    el.style.alignItems = "center";
    el.style.gap = "10px";
    var msgSpan = document.createElement("span");
    msgSpan.textContent = msg;
    var undoBtn = document.createElement("button");
    undoBtn.type = "button";
    undoBtn.textContent = "เลิกทำ";
    undoBtn.style.cssText = "background:transparent;border:1px solid var(--on-accent);color:inherit;border-radius:999px;padding:3px 11px;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;";
    el.appendChild(msgSpan);
    el.appendChild(undoBtn);
    toastStack.appendChild(el);
    var timer = setTimeout(function(){ el.remove(); }, 6000);
    undoBtn.addEventListener("click", function(){
      clearTimeout(timer);
      el.remove();
      undoFn();
    });
  }

  /* ================= Persistence ================= */
  function setSaveState(s, text){
    saveIndicator.setAttribute("data-state", s);
    saveIndicatorText.textContent = text;
  }

  function serializeState(){
    return JSON.stringify({ programs: state.programs, version: 1 });
  }

  function scheduleSave(){
    if(!isWriter) return;
    setSaveState("saving", "กำลังบันทึก…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 650);
  }

  function doSave(){
    var payload = serializeState();
    if(capabilityMode === "artifact" && artifactApi){
      artifactApi.publish({ "data.json": payload }).then(function(){
        setSaveState("saved", "บันทึกแล้ว");
      }).catch(function(err){
        handleSaveError(err);
      });
    } else if(capabilityMode === "local"){
      try{
        localStorage.setItem("tcas-tracker-data", payload);
        setSaveState("saved", "บันทึกในเบราว์เซอร์นี้แล้ว");
      }catch(e){
        setSaveState("error", "บันทึกไม่สำเร็จ");
      }
    }
  }

  function handleSaveError(err){
    var code = err && err.code;
    if(code === "not_writer" || code === "not_granted"){
      isWriter = false;
      showReadonly("สิทธิ์การแก้ไขถูกเปลี่ยนเป็นอ่านอย่างเดียว การเปลี่ยนแปลงล่าสุดอาจไม่ถูกบันทึก");
      render();
      return;
    }
    if(code === "conflict"){
      setSaveState("saving", "มีการอัปเดตจากอุปกรณ์อื่น กำลังโหลดใหม่…");
      setTimeout(function(){ location.reload(); }, 600);
      return;
    }
    if(code === "upstream_error"){
      setTimeout(function(){ doSave(); }, 1200 + Math.random()*800);
      setSaveState("saving", "กำลังลองบันทึกอีกครั้ง…");
      return;
    }
    setSaveState("error", "บันทึกไม่สำเร็จ");
    toast("บันทึกไม่สำเร็จ: " + (err && err.message ? err.message : "ลองใหม่อีกครั้ง"), "danger");
  }

  function showReadonly(text){
    readonlyBanner.hidden = false;
    $("readonlyBannerText").textContent = text || "มุมมองนี้เป็นแบบอ่านอย่างเดียว การแก้ไขจะไม่ถูกบันทึก";
    addBtn.setAttribute("disabled","disabled");
  }

  /* ================= Init / load ================= */
  function defaultProgram(){
    return {
      id:"", university:"", faculty:"", major:"", curriculum:"", round:"",
      openDate:null, closeDate:null, resultDate:null, criteria:"", tcasFolio:false,
      link:"", documents:[], status:"รอประกาศเกณฑ์", note:"",
      interviewDate:null, interviewFormat:"", interviewPlace:"",
      priority:0, applicationFee:null, feePaid:false
    };
  }

  function normalizeLoaded(data){
    if(!data || !Array.isArray(data.programs)) return null;
    return data.programs.map(function(p){
      return Object.assign(defaultProgram(), p);
    });
  }

  function init(){
    Promise.resolve().then(function(){
      if(window.claude && typeof window.claude.use === "function"){
        return window.claude.use("artifact");
      }
      return null;
    }).then(function(api){
      if(api){
        artifactApi = api;
        capabilityMode = "artifact";
        isWriter = true;
      } else {
        capabilityMode = "local";
        isWriter = true;
      }
      loadInitialData();
    }).catch(function(){
      capabilityMode = "local";
      isWriter = true;
      loadInitialData();
    });
  }

  function getSeedPrograms(){
    return SEED_PROGRAMS.map(function(p){ return Object.assign(defaultProgram(), p); });
  }

  function loadInitialData(){
    if(capabilityMode === "artifact"){
      fetch("data.json", { cache:"no-store" }).then(function(res){
        if(!res.ok) throw new Error("no data.json yet");
        return res.json();
      }).then(function(data){
        var normalized = normalizeLoaded(data);
        state.programs = normalized || getSeedPrograms();
        finishInit();
      }).catch(function(){
        state.programs = getSeedPrograms();
        finishInit();
      });
    } else {
      var raw = null;
      try{ raw = localStorage.getItem("tcas-tracker-data"); }catch(e){}
      if(raw){
        try{
          var parsed = JSON.parse(raw);
          var normalized = normalizeLoaded(parsed);
          state.programs = normalized || getSeedPrograms();
        }catch(e){
          state.programs = getSeedPrograms();
        }
      } else {
        state.programs = getSeedPrograms();
      }
      setSaveState("idle", "โหมดเบราว์เซอร์นี้เท่านั้น");
      finishInit();
    }
  }

  function finishInit(){
    render();
    if(capabilityMode === "artifact"){
      setSaveState("idle", "พร้อมใช้งาน");
    }
  }

  function duplicateProgram(id){

    var p = state.programs.find(function(x){ return x.id === id; });

    var idx = state.programs.indexOf(p);
    var clone = JSON.parse(JSON.stringify(p));
    clone.id = "p-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  /* ================= .ics calendar export ================= */
  function icsEscape(text){
    return String(text||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
  }
  function addDaysISO(iso, days){
    var d = new Date(iso+"T00:00:00Z");
    d.setUTCDate(d.getUTCDate()+days);
    return d.toISOString().slice(0,10);
  }
  function buildICS(){
    var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//TCAS Tracker//TH","CALSCALE:GREGORIAN"];
    var dtstamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    state.programs.forEach(function(p){
      if(isFullDate(p.closeDate)){
        lines.push("BEGIN:VEVENT");
        lines.push("UID:"+p.id+"-close@tcas-tracker");
        lines.push("DTSTAMP:"+dtstamp);
        lines.push("DTSTART;VALUE=DATE:"+p.closeDate.replace(/-/g,""));
        lines.push("DTEND;VALUE=DATE:"+addDaysISO(p.closeDate,1).replace(/-/g,""));
        lines.push("SUMMARY:"+icsEscape("ปิดรับสมัคร - "+p.university+(p.major?" ("+p.major+")":"")));
        if(p.round) lines.push("DESCRIPTION:"+icsEscape(p.round));
        lines.push("END:VEVENT");
      }
      if(isFullDate(p.interviewDate)){
        lines.push("BEGIN:VEVENT");
        lines.push("UID:"+p.id+"-interview@tcas-tracker");
        lines.push("DTSTAMP:"+dtstamp);
        lines.push("DTSTART;VALUE=DATE:"+p.interviewDate.replace(/-/g,""));
        lines.push("DTEND;VALUE=DATE:"+addDaysISO(p.interviewDate,1).replace(/-/g,""));
        var fmtLabel = p.interviewFormat ? (INTERVIEW_FORMAT_LABEL[p.interviewFormat]||p.interviewFormat) : "";
        lines.push("SUMMARY:"+icsEscape("สัมภาษณ์ - "+p.university+(fmtLabel?" ("+fmtLabel+")":"")));
        if(p.interviewPlace) lines.push("DESCRIPTION:"+icsEscape(p.interviewPlace));
        lines.push("END:VEVENT");
      }
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n")+"\r\n";
  }

  function downloadIcsFallback(content){
    var blob = new Blob([content], {type:"text/calendar;charset=utf-8"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "tcas-deadlines.ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function exportIcs(){
    var count = state.programs.filter(function(p){ return isFullDate(p.closeDate) || isFullDate(p.interviewDate); }).length;
    if(count === 0){ toast("ยังไม่มีวันปิดรับ/วันสัมภาษณ์ให้ส่งออก"); return; }
    var content = buildICS();

    var useCapability = (capabilityMode === "artifact" && window.claude && typeof window.claude.use === "function");
    if(!useCapability){
      try{ downloadIcsFallback(content); toast("ดาวน์โหลดไฟล์ปฏิทินแล้ว ("+count+" กำหนดการ)"); }
      catch(e){ toast("ส่งออกไฟล์ไม่สำเร็จ", "danger"); }
      return;
    }
    window.claude.use("downloads").then(function(dl){
      if(!dl){ downloadIcsFallback(content); toast("ดาวน์โหลดไฟล์ปฏิทินแล้ว ("+count+" กำหนดการ)"); return; }
      return dl.save({ filename:"tcas-deadlines.ics", data: content }).then(function(){
        toast("ดาวน์โหลดไฟล์ปฏิทินแล้ว ("+count+" กำหนดการ)");
      }).catch(function(err){
        if(err && err.code === "declined") return;
        try{ downloadIcsFallback(content); toast("ดาวน์โหลดไฟล์ปฏิทินแล้ว ("+count+" กำหนดการ)"); }
        catch(e){ toast("ส่งออกไฟล์ไม่สำเร็จ", "danger"); }
      });
    }).catch(function(){
      try{ downloadIcsFallback(content); toast("ดาวน์โหลดไฟล์ปฏิทินแล้ว ("+count+" กำหนดการ)"); }
      catch(e){ toast("ส่งออกไฟล์ไม่สำเร็จ", "danger"); }
    });
  }
  $("exportIcsBtn").addEventListener("click", exportIcs);

  /* ================= Go ================= */
  initTheme();
  init();
})();
</script>
